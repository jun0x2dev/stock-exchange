# 로컬 개발용 인프라. bootRun을 실행하면 Spring Boot가 자동으로 띄우고 접속 정보도 주입한다.
# 전체를 Docker로 띄우려면 docker compose --profile app up --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: exchange
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 파일에 POSTGRES_PASSWORD를 설정하세요}
    ports:
      # 로컬에 설치된 PostgreSQL(5432)과 겹치지 않도록 5433을 쓰고, 외부에는 열지 않는다.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # 최초 초기화 때 뜨는 임시 서버(유닉스 소켓 전용)를 준비 완료로 보지 않도록 TCP로 확인한다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U exchange -d exchange"]
      # 느린 디스크에서는 최초 초기화가 1분 이상 걸릴 수 있다.
      start_period: 180s
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.2.2
    environment:
      # 로컬 개발용이라 작게 쓴다.
      KAFKA_HEAP_OPTS: -Xms192m -Xmx256m
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # 브로커가 하나라 내부 토픽도 복제하지 않는다.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # 기본값(50)이면 느린 디스크에서 처음 뜰 때 1분 넘게 걸린다.
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 토픽은 core가 정해진 설정으로 만든다.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      # 접속 인증이 없으므로 외부에는 열지 않는다.
      - "127.0.0.1:9094:9094"
    mem_limit: 512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      start_period: 60s
      interval: 10s
      timeout: 10s
      retries: 10

  # 스키마 변경은 소유자 계정으로 한 번만 실행하고 끝난다. 계속 떠 있는 core에는 소유자 비밀번호를 주지 않는다.
  migrate:
    profiles: [app]
    image: flyway/flyway:12.4.0-alpine
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/exchange
      FLYWAY_USER: exchange
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_PLACEHOLDERS_APPPASSWORD: ${EXCHANGE_DB_APP_PASSWORD:?.env 파일에 EXCHANGE_DB_APP_PASSWORD를 설정하세요}
    volumes:
      - ./backend/exchange-core/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      postgres: { condition: service_healthy }
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m

  core:
    profiles: [app]
    build:
      context: .
      target: core
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/exchange
      SPRING_FLYWAY_ENABLED: "false"
      EXCHANGE_DB_APP_PASSWORD: ${EXCHANGE_DB_APP_PASSWORD:?.env 파일에 EXCHANGE_DB_APP_PASSWORD를 설정하세요}
      EXCHANGE_AUDIT_KEY: ${EXCHANGE_AUDIT_KEY:?.env 파일에 EXCHANGE_AUDIT_KEY를 설정하세요}
      EXCHANGE_AUDIT_ANCHOR_FILE: /var/lib/exchange/audit-anchor.log
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EXCHANGE_DEMO_PASSWORD: ${EXCHANGE_DEMO_PASSWORD:-}
      EXCHANGE_BOT_ENABLED: "true"
    ports:
      # 다른 프로그램이 8080을 쓰면 .env의 CORE_PORT로 바꾼다.
      - "127.0.0.1:${CORE_PORT:-8080}:8080"
    volumes:
      # 감사 로그 체인의 마지막 값. DB 볼륨과 나눈다.
      - audit-anchor:/var/lib/exchange
    depends_on:
      migrate: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    restart: on-failure

  engine:
    profiles: [app]
    build:
      context: .
      target: engine
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      # 토픽은 core가 만든다.
      core: { condition: service_healthy }
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    restart: on-failure

  feed:
    profiles: [app]
    build:
      context: .
      target: feed
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      core: { condition: service_healthy }
    security_opt: ["no-new-privileges:true"]
    mem_limit: 160m
    restart: on-failure

volumes:
  postgres-data:
  kafka-data:
  audit-anchor:
