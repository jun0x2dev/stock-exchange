spring:
  application:
    name: stock-exchange
  config:
    # 로컬 개발 값. git에 올리지 않는다.
    import: optional:file:.env[.properties]
  jackson:
    deserialization:
      # 1.5주를 1주로 잘라 접수하지 않는다.
      accept-float-as-int: false
    datatype:
      enum:
        # side: 1 같은 숫자를 순서로 해석해 매수·매도를 바꿔 접수하지 않는다.
        fail-on-numbers-for-enums: true
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway로만 변경하고, 엔티티와 어긋나면 기동에 실패한다.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: strict

exchange:
  matching:
    workers: 4
  demo:
    # 값이 있을 때만 체험용 사용자와 호가를 만든다. 운영에서는 비워 둔다.
    password: ${EXCHANGE_DEMO_PASSWORD:}
