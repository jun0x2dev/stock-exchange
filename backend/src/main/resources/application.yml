spring:
  application:
    name: stock-exchange
  config:
    # 로컬 개발 값. git에 올리지 않는다.
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway로만 변경하고, 엔티티와 어긋나면 기동에 실패한다.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: strict

exchange:
  matching:
    workers: 4
  demo:
    # 값이 있을 때만 체험용 사용자와 호가를 만든다. 운영에서는 비워 둔다.
    password: ${EXCHANGE_DEMO_PASSWORD:}
