spring:
  application:
    name: stock-exchange
  config:
    # 로컬 개발 값. git에 올리지 않는다.
    import: optional:file:.env[.properties]
  flyway:
    placeholders:
      # 앱 계정의 비밀번호를 마이그레이션이 맞춘다.
      apppassword: ${exchange.db.app-password}
  jackson:
    deserialization:
      # 1.5주를 1주로 잘라 접수하지 않는다.
      accept-float-as-int: false
    datatype:
      enum:
        # side: 1 같은 숫자를 순서로 해석해 매수·매도를 바꿔 접수하지 않는다.
        fail-on-numbers-for-enums: true
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway로만 변경하고, 엔티티와 어긋나면 기동에 실패한다.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      # 엔진이 끝내지 못하고 취소한 결과는 읽지 않는다.
      isolation-level: read_committed
      properties:
        # 죽은 뒤 다시 뜬 core가 이전 멤버의 만료(기본 45초)를 기다리지 않고 바로 이어받게 한다.
        group.instance.id: exchange-core
        session.timeout.ms: 10000
    listener:
      type: batch
      ack-mode: batch
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    # 연결할 때마다 전체 설정을 출력하는 것을 막는다.
    org.apache.kafka: warn

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: strict

exchange:
  fds:
    # 허수성 호가 기준(프로젝트 정책, 거래소 규정 아님). 최근 lookback 동안 취소된 주문 중
    # 체결이 max-fill-percent% 이하이고, max-lifetime 안에 취소됐고, 그사이 같은 계좌가 반대편에서 체결했으며
    # 그 수량의 fake-to-real배 이상이고, 들어온 순간 같은 쪽 잔량의 min-depth-share-percent% 이상인 주문을 경보한다.
    spoofing:
      lookback-minutes: 10
      max-lifetime-seconds: 10
      max-fill-percent: 10
      fake-to-real: 5
      min-depth-share-percent: 50
  db:
    # 앱 전용 DB 계정(exchange_app)의 비밀번호.
    app-password: ${EXCHANGE_DB_APP_PASSWORD:}
  audit:
    # 감사 로그 체인의 HMAC 키(Base64, 32바이트 이상).
    key: ${EXCHANGE_AUDIT_KEY:}
    # 체인의 마지막 값을 DB 밖에 남길 파일.
    anchor-file: ${EXCHANGE_AUDIT_ANCHOR_FILE:audit-anchor.log}
  bot:
    # 켜면 quote 토픽의 시세를 따라 maker가 호가를 내고 taker가 거래한다. exchange-feed도 함께 띄워야 한다.
    enabled: ${EXCHANGE_BOT_ENABLED:false}
    spoofer:
      # 켜면 탐지 실험용 공격자(spoofer)가 허수성 호가와 미끼 주문을 낸다. 호가 봇과 함께 켠다.
      enabled: ${EXCHANGE_BOT_SPOOFER_ENABLED:false}
  demo:
    # 값이 있을 때만 체험용 사용자와 호가를 만든다. 운영에서는 비워 둔다.
    password: ${EXCHANGE_DEMO_PASSWORD:}
