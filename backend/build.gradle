plugins {
	id 'org.springframework.boot' version '4.1.3' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'io.spring.dependency-management'

	group = 'com.exchange'
	version = '0.0.1-SNAPSHOT'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	// 간접 의존성까지 버전을 고정한다. Trivy도 이 lockfile로 취약점을 검사한다.
	dependencyLocking {
		lockAllConfigurations()
	}

	repositories {
		mavenCentral()
	}

	dependencyManagement {
		imports {
			mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
		}
		// kafka-clients가 가져오는 버전의 취약점(CVE-2026-106451, CVE-2026-108106, CVE-2026-93451)을 고친 버전.
		// Spring Boot가 이보다 높은 버전을 쓰면 지운다.
		dependencies {
			dependency 'at.yawk.lz4:lz4-java:1.11.4'
			dependency 'org.xerial.snappy:snappy-java:1.1.10.9'
		}
	}

	dependencies {
		testImplementation 'org.junit.jupiter:junit-jupiter'
		testImplementation 'org.assertj:assertj-core'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}

	tasks.named('test') {
		useJUnitPlatform()
	}
}
